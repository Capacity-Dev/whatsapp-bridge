name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed in binaries (e.g. 0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" != v* ]]; then
            REF="${{ github.event.inputs.version }}"
          fi
          if [[ "$REF" == v* ]]; then
            REF="${REF#v}"
          fi
          if [ -z "$REF" ]; then
            REF="dev"
          fi
          echo "value=${REF}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.value }}"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          OUT="dist/whatsapp-bridge_${VER}_${{ matrix.os }}_${{ matrix.arch }}${EXT}"
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o "$OUT" .
          echo "Built $OUT"

      - name: Package
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.value }}"
          cd dist
          NAME="whatsapp-bridge_${VER}_${{ matrix.os }}_${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "${NAME}.zip" "${NAME}.exe"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-bridge_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
